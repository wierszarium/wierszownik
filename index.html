<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wierszownik — Pod Wielkim Dachem Nieba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Literata:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --zielen-tlo:#c4e7c2;
    --zielen-gleboka:#a8d4a5;
    --papier:#fff4d1;
    --papier-cien:#f5e9c0;
    --zielen-ciemna:#1e6b1e;
    --zielen-las:#2d5016;
    --zielen-mech:#558b2f;
    --brzoskwinia:#ffe0b2;
    --brzoskwinia-ciemna:#ffcc80;
    --terakota:#bf360c;
    --tekst:#2b3a2b;
    --tekst-cichy:#5c6b5c;
    --linia:rgba(85,139,47,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#3a3f3a;
    font-family:'Literata',Georgia,serif;color:var(--tekst);
    min-height:100vh;padding:24px 16px;
  }
  /* rama obejmująca całość — szerokość trzech tomików */
  .rama{
    max-width:840px;margin:0 auto;
    background:
      radial-gradient(ellipse at 50% -20%, #d3f0d0 0%, var(--zielen-tlo) 55%, var(--zielen-gleboka) 100%);
    border:1px solid rgba(45,80,22,.35);
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
    overflow:hidden;padding-bottom:20px;
  }

  /* nagłówek */
  .top{
    text-align:center;padding:28px 20px 8px;
  }
  .top .marka{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--zielen-mech);
    opacity:.75;margin-bottom:10px;
  }
  .top h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:34px;
    color:var(--zielen-las);letter-spacing:.01em;line-height:1.1;
  }
  .top .podtytul{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:16px;color:var(--tekst-cichy);margin-top:6px;
  }

  /* pasek akcji */
  .pasek{
    max-width:920px;margin:18px auto 0;padding:0 20px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  }
  .btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;
    border:1.5px solid var(--zielen-mech);background:var(--papier);
    color:var(--zielen-las);padding:9px 16px;border-radius:8px;cursor:pointer;
    transition:all .2s ease;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--zielen-mech);color:var(--papier);transform:translateY(-1px)}
  .btn.solid{background:var(--zielen-mech);color:#fff}
  .btn.solid:hover{background:var(--zielen-las)}
  .btn.mini{padding:6px 12px;font-size:11px}
  .btn.danger{border-color:#c0603a;color:#a5401a}
  .btn.danger:hover{background:#c0603a;color:#fff}

  /* siatka kafelków */
  .polka{
    margin:26px auto 20px;padding:0 24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;
  }

  /* kafelek tomiku — glassmorphism (W1) */
  .tomik{
    position:relative;min-height:172px;padding:22px;cursor:pointer;
    border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(135deg, rgba(85,139,47,.88), rgba(30,107,30,.92));
    box-shadow:0 8px 24px rgba(30,80,20,.35);
    transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s ease;
  }
  /* świetlista krawędź */
  .tomik::before{
    content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
    background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 40%,transparent 60%,rgba(255,255,255,.2));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .tomik:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 36px rgba(30,80,20,.45)}
  /* szklana ikona */
  .tomik .glass-iko{
    position:absolute;top:18px;left:18px;width:48px;height:48px;border-radius:14px;
    background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  /* błysk po szkle */
  .tomik .shimmer{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
  .tomik .shimmer::after{
    content:'';position:absolute;top:-50%;left:-60%;width:50%;height:200%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transform:rotate(25deg);transition:left .6s ease;
  }
  .tomik:hover .shimmer::after{left:130%}
  .tomik .tyt{
    font-family:'Fraunces',serif;font-weight:600;font-size:21px;
    color:#fff;line-height:1.15;margin-top:60px;margin-bottom:6px;
    word-break:break-word;text-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .tomik .pod{
    font-family:'Fraunces',serif;font-style:italic;font-size:12px;
    color:rgba(255,255,255,.8);flex:1;
  }
  .tomik .otworz{display:none}
  .tomik .licznik{
    position:absolute;right:12px;bottom:11px;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    color:#fff;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);
    min-width:24px;height:24px;padding:0 8px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .tomik .usun-tomik{
    position:absolute;right:10px;top:12px;width:26px;height:26px;z-index:6;
    border:none;background:rgba(255,255,255,.2);color:#fff;
    border-radius:8px;cursor:pointer;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
    opacity:0;transition:opacity .2s ease,background .2s ease;
  }
  .tomik:hover .usun-tomik{opacity:1}
  .tomik .usun-tomik:hover{background:rgba(191,54,12,.85)}

  /* ===== STYL 2 — gradientowa animowana ramka ===== */
  .tomik.styl-2{
    background:linear-gradient(150deg,#1e3d1e,#0f2810);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .tomik.styl-2::before{
    background:linear-gradient(135deg,#8bb26a,#558b2f,#ffcc80,#558b2f);
    background-size:300% 300%;padding:2px;
    animation:tomikPrzeplyw 4s ease infinite;
  }
  @keyframes tomikPrzeplyw{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .tomik.styl-2 .glass-iko{
    background:radial-gradient(circle at 35% 30%,#a8d48a,#558b2f);
    border:none;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.4);
    border-radius:50%;
  }
  .tomik.styl-2 .tyt{color:#f0f7e8;text-shadow:none}
  .tomik.styl-2 .pod{color:rgba(200,220,180,.7)}
  .tomik.styl-2 .licznik{background:rgba(139,178,106,.25);color:#c5e0a5}

  /* ===== STYL 3 — książka 3D ===== */
  .tomik.styl-3{
    background:linear-gradient(105deg,#4a7a2c 0%,#4a7a2c 8px,#fffdf3 8px,#fdf0cf 100%);
    border-radius:4px 14px 14px 4px;padding-left:30px;
    box-shadow:0 3px 8px rgba(45,80,22,.15),0 14px 30px rgba(45,80,22,.2),inset -3px 0 8px rgba(45,80,22,.06);
  }
  .tomik.styl-3::before{
    background:none;padding:0;
    right:0;left:auto;top:6px;bottom:6px;width:5px;height:auto;inset:auto;border-radius:0 3px 3px 0;
    background:repeating-linear-gradient(180deg,#e8dcb8 0 2px,#d8cca4 2px 4px);
  }
  .tomik.styl-3 .glass-iko{
    background:rgba(85,139,47,.12);border:1px solid rgba(85,139,47,.25);
    backdrop-filter:none;color:#2d5016;
  }
  .tomik.styl-3 .tyt{color:#1e6b1e;text-shadow:none}
  .tomik.styl-3 .pod{color:#5c6b5c}
  .tomik.styl-3 .licznik{background:rgba(85,139,47,.15);color:#558b2f;backdrop-filter:none}
  .tomik.styl-3 .usun-tomik{background:rgba(85,139,47,.15);color:#2d5016;backdrop-filter:none}
  .tomik.styl-3 .usun-tomik:hover{background:rgba(191,54,12,.85);color:#fff}
  .tomik.styl-3:hover{transform:translateY(-5px) rotate(-1deg)}

  /* ===== STYL 4 — frosted glass na liściach ===== */
  .tomik.styl-4{
    background:linear-gradient(160deg,#7cae54,#3d6b1f,#2d5016);
    justify-content:flex-end;padding:20px;
    box-shadow:0 10px 28px rgba(30,60,15,.4);
  }
  .tomik.styl-4 .liscie{
    position:absolute;inset:0;opacity:.25;pointer-events:none;
    background-image:radial-gradient(circle at 20% 30%,#c8e6a0 0 8px,transparent 8px),
      radial-gradient(circle at 70% 20%,#a8d48a 0 12px,transparent 12px),
      radial-gradient(circle at 85% 60%,#c8e6a0 0 10px,transparent 10px),
      radial-gradient(circle at 40% 75%,#a8d48a 0 14px,transparent 14px);
  }
  .tomik.styl-4 .glass-iko{display:none}
  .tomik.styl-4 .panel{
    position:relative;background:rgba(255,253,243,.82);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:14px 16px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  .tomik.styl-4 .tyt{color:#1e6b1e;margin:0 0 2px;text-shadow:none}
  .tomik.styl-4 .pod{color:#5c6b5c;flex:none}
  .tomik.styl-4 .licznik{background:#558b2f;color:#fff;top:12px;bottom:auto;backdrop-filter:none}

  /* ===== STYL 5 — neumorfizm ===== */
  .tomik.styl-5{
    background:#d8ecd4;border-radius:20px;
    box-shadow:8px 8px 20px rgba(140,170,135,.6),-8px -8px 20px rgba(255,255,255,.9);
  }
  .tomik.styl-5::before{display:none}
  .tomik.styl-5 .glass-iko{
    background:#d8ecd4;border:none;backdrop-filter:none;border-radius:50%;
    box-shadow:inset 4px 4px 8px rgba(140,170,135,.6),inset -4px -4px 8px rgba(255,255,255,.9);
  }
  .tomik.styl-5 .tyt{color:#2d5016;text-shadow:none}
  .tomik.styl-5 .pod{color:#5c6b5c}
  .tomik.styl-5 .licznik{
    background:#d8ecd4;color:#558b2f;backdrop-filter:none;
    box-shadow:inset 2px 2px 4px rgba(140,170,135,.6),inset -2px -2px 4px rgba(255,255,255,.9);
  }
  .tomik.styl-5 .usun-tomik{background:rgba(140,170,135,.3);color:#2d5016;backdrop-filter:none}
  .tomik.styl-5 .usun-tomik:hover{background:rgba(191,54,12,.85);color:#fff}
  .tomik.styl-5:hover{transform:translateY(-4px)}

  /* próbki stylów w kafelku Nowy tomik — koraliki */
  .probki{display:flex;gap:11px;justify-content:center;margin-top:14px}
  .probka{
    width:28px;height:28px;border-radius:50%;cursor:pointer;
    border:2px solid rgba(255,255,255,.7);
    box-shadow:0 2px 5px rgba(45,80,22,.25), inset 0 2px 4px rgba(255,255,255,.4);
    transition:transform .18s ease, box-shadow .18s ease;position:relative;
  }
  .probka::after{
    content:'';position:absolute;top:4px;left:6px;width:9px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.55);filter:blur(1px);pointer-events:none;
  }
  .probka:hover{transform:scale(1.2) translateY(-2px);box-shadow:0 5px 12px rgba(45,80,22,.35), inset 0 2px 4px rgba(255,255,255,.4)}
  .probka.wybrana{
    border-color:#2d5016;
    box-shadow:0 0 0 3px rgba(45,80,22,.25), 0 3px 8px rgba(45,80,22,.35), inset 0 2px 4px rgba(255,255,255,.4);
    transform:scale(1.12);
  }
  .probka.s1{background:radial-gradient(circle at 35% 30%,#6ba03c,#1e6b1e)}
  .probka.s2{background:radial-gradient(circle at 35% 30%,#a8d48a,#ffcc80)}
  .probka.s3{background:radial-gradient(circle at 35% 30%,#8bb26a,#4a7a2c)}
  .probka.s4{background:radial-gradient(circle at 35% 30%,#9ed17a,#2d5016)}
  .probka.s5{background:radial-gradient(circle at 35% 30%,#eef6ea,#c4ddbe)}
  .probki-hint{
    font-family:'JetBrains Mono',monospace;font-size:9px;color:#8a5038;
    text-align:center;margin-top:10px;letter-spacing:.03em;
  }

  /* kafelek nowy tomik */
  .tomik-nowy{
    background:var(--brzoskwinia)!important;
    border-radius:16px;box-shadow:none;overflow:visible;
    align-items:center;justify-content:center;text-align:center;padding:24px 20px;
    min-height:172px;
  }
  .tomik-nowy::before{display:none}
  .tomik-nowy:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(191,54,12,.15)}

  /* podgląd stylu na kafelku Nowy tomik */
  .tomik-nowy.podglad-1{background:linear-gradient(135deg,rgba(85,139,47,.9),rgba(30,107,30,.94))!important}
  .tomik-nowy.podglad-2{background:linear-gradient(150deg,#1e3d1e,#0f2810)!important}
  .tomik-nowy.podglad-3{background:linear-gradient(105deg,#4a7a2c 0%,#4a7a2c 8px,#fffdf3 8px,#fdf0cf 100%)!important}
  .tomik-nowy.podglad-4{background:linear-gradient(160deg,#7cae54,#3d6b1f,#2d5016)!important}
  .tomik-nowy.podglad-5{background:#d8ecd4!important;
    box-shadow:8px 8px 20px rgba(140,170,135,.6),-8px -8px 20px rgba(255,255,255,.9)!important}
  /* podglądy z ciemnym tłem — rozjaśnij napis plus i hint */
  .tomik-nowy.podglad-1 .plus,
  .tomik-nowy.podglad-2 .plus,
  .tomik-nowy.podglad-4 .plus{color:#fff}
  .tomik-nowy.podglad-1 .probki-hint,
  .tomik-nowy.podglad-2 .probki-hint,
  .tomik-nowy.podglad-4 .probki-hint{color:rgba(255,255,255,.8)}
  /* input i przycisk zawsze czytelne na wierzchu */
  .tomik-nowy[class*="podglad-"] input{
    background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.6);position:relative;z-index:3;
  }
  .tomik-nowy[class*="podglad-"] .btn{position:relative;z-index:3}
  .tomik-nowy[class*="podglad-"] .probki{position:relative;z-index:3}
  .tomik-nowy .plus{
    font-family:'Fraunces',serif;font-weight:600;font-size:18px;
    color:var(--terakota);margin-bottom:12px;
  }
  .tomik-nowy input{
    width:100%;font-family:'Literata',serif;font-size:14px;
    padding:8px 10px;border:1px solid rgba(191,54,12,.3);border-radius:6px;
    background:#fff8ec;color:var(--tekst);margin-bottom:10px;text-align:center;
  }
  .tomik-nowy input:focus{outline:none;border-color:var(--terakota)}
  .tomik-nowy .plus-hint{
    font-family:'Fraunces',serif;font-style:italic;font-size:12px;
    color:#8a5038;margin-top:2px;
  }

  /* ===== WIDOK TOMIKU (wnętrze) ===== */
  .wnetrze{margin:0 auto;display:none}
  .wnetrze.on{display:block}
  .wnetrze-head{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:20px 0 14px;border-bottom:2px solid var(--linia);margin-bottom:20px;
  }
  .wnetrze-head h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;
    color:var(--zielen-las);flex:1;min-width:200px;
  }

  /* dwie kolumny: spis + edytor */
  .tomik-uklad{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
  @media(max-width:680px){.tomik-uklad{grid-template-columns:1fr}}

  .spis{
    background:var(--papier);border:1px solid var(--linia);border-radius:10px;
    padding:14px;box-shadow:0 2px 8px rgba(45,80,22,.08);
  }
  .spis h3{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--zielen-mech);margin-bottom:12px;
    padding-bottom:8px;border-bottom:1px solid var(--linia);
  }
  .spis-poz{
    padding:11px 14px;border-radius:8px;cursor:pointer;margin-bottom:8px;
    font-family:'Literata',serif;font-size:14px;color:#1e3d1e;
    transition:all .18s ease;display:flex;align-items:center;gap:9px;
    background:var(--papier);
    border:1px solid rgba(85,139,47,.3);
    border-bottom:2px solid rgba(85,139,47,.35);
    box-shadow:0 2px 4px rgba(45,80,22,.1), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .spis-poz:hover{
    background:#fffbe8;transform:translateY(-1px);
    box-shadow:0 4px 8px rgba(45,80,22,.16), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .spis-poz:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(45,80,22,.12)}
  .spis-poz.akt{
    background:linear-gradient(180deg,#eaf5e0 0%,#dcefc8 100%);
    border-color:var(--zielen-mech);border-bottom-color:var(--zielen-las);
    font-weight:600;
    box-shadow:0 2px 6px rgba(85,139,47,.25), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .spis-poz .nr{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--zielen-mech);opacity:.7;min-width:16px;font-weight:500;
  }
  .spis-poz .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spis-pusty{
    font-family:'Fraunces',serif;font-style:italic;font-size:13px;
    color:var(--tekst-cichy);text-align:center;padding:16px 8px;
  }

  /* edytor wiersza */
  .edytor{
    background:var(--papier);border:1px solid var(--linia);border-radius:10px;
    padding:20px;box-shadow:0 2px 8px rgba(45,80,22,.08);
  }
  .edytor label{
    display:block;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--zielen-mech);
    margin-bottom:6px;margin-top:14px;
  }
  .edytor label:first-child{margin-top:0}
  .edytor input, .edytor textarea{
    width:100%;font-family:'Literata',serif;color:var(--tekst);
    background:#fffdf6;border:1px solid var(--linia);border-radius:7px;
    padding:11px 13px;resize:vertical;
  }
  .edytor input{font-size:16px;font-weight:500}
  .edytor input:focus, .edytor textarea:focus{outline:none;border-color:var(--zielen-mech)}
  .edytor textarea{
    font-size:15px;line-height:1.7;min-height:280px;
    font-family:'Literata',serif;
  }
  .edytor-akcje{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .edytor-pusty{
    text-align:center;padding:50px 20px;color:var(--tekst-cichy);
  }
  .edytor-pusty .ikona{font-size:40px;opacity:.4;margin-bottom:12px}
  .edytor-pusty p{font-family:'Fraunces',serif;font-style:italic;font-size:15px}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);
    background:var(--zielen-las);color:#fff;padding:12px 22px;border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:13px;z-index:9999;
    opacity:0;transition:all .35s ease;pointer-events:none;
    box-shadow:0 6px 20px rgba(45,80,22,.3);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  input[type=file]{display:none}
</style>
</head>
<body>

<!-- ===== EKRAN TOMIKÓW ===== -->
<div id="ekran-polka">
 <div class="rama">
  <div class="top">
    <div class="marka">Pod Wielkim Dachem Nieba · warsztat poety</div>
    <h1>Wierszownik</h1>
    <div class="podtytul">Twoje tomiki, zanim trafią na mapę</div>
  </div>

  <div class="pasek">
    <button class="btn" onclick="wczytajPlik()">📂 Wczytaj dane.json</button>
    <button class="btn solid" onclick="eksportuj()">⬇ Zapisz jako dane.json</button>
  </div>

  <div class="polka" id="polka"></div>
 </div>
</div>

<!-- ===== WNĘTRZE TOMIKU ===== -->
<div class="wnetrze" id="wnetrze">
 <div class="rama" style="padding:0 24px 24px">
  <div class="wnetrze-head">
    <button class="btn mini" onclick="wrocDoPolki()">← Tomiki</button>
    <h2 id="wnetrze-tytul"></h2>
    <button class="btn mini" onclick="pobierzTomik()">⬇ Pobierz tomik</button>
    <button class="btn mini" onclick="nowyWiersz()">➕ Nowy wiersz</button>
  </div>
  <div class="tomik-uklad">
    <div class="spis">
      <h3>Wiersze w tomiku</h3>
      <div id="spis-lista"></div>
    </div>
    <div class="edytor" id="edytor"></div>
  </div>
 </div>
</div>

<input type="file" id="plik-input" accept=".json,application/json">
<div id="toast"></div>

<script>
/* ============ DANE ============ */
const KLUCZ = 'wdn_notatnik_tomiki';

let dane = { tomiki: [] };
let aktTomik = null;    // indeks otwartego tomiku
let aktWiersz = null;   // indeks otwartego wiersza

/* ============ ZAPIS / ODCZYT localStorage ============ */
function zapiszLokalnie(){
  try{ localStorage.setItem(KLUCZ, JSON.stringify(dane)); }catch(e){}
}
function wczytajLokalnie(){
  try{
    const s = localStorage.getItem(KLUCZ);
    if(s){ dane = JSON.parse(s); if(!dane.tomiki) dane.tomiki = []; }
  }catch(e){ dane = { tomiki: [] }; }
}

/* ============ EKRAN TOMIKÓW ============ */
function rysujPolke(){
  const polka = document.getElementById('polka');
  polka.innerHTML = '';

  dane.tomiki.forEach((t, i)=>{
    const styl = t.styl || 1;
    const el = document.createElement('div');
    el.className = 'tomik styl-' + styl;
    el.onclick = (e)=>{ if(!e.target.closest('.usun-tomik')) otworzTomik(i); };
    const licznikTekst = (t.wiersze||[]).length;
    const usun = `<button class="usun-tomik" title="Usuń tomik" onclick="usunTomik(${i})">✕</button>`;
    const shimmer = `<div class="shimmer"></div>`;

    if(styl === 4){
      // frosted na liściach — tekst w panelu na dole
      el.innerHTML = `
        ${shimmer}
        <div class="liscie"></div>
        ${usun}
        <span class="licznik" title="Liczba wierszy">${licznikTekst}</span>
        <div class="panel">
          <div class="tyt">${esc(t.tytul) || 'Tomik bez tytułu'}</div>
          <div class="pod">Wejdź w swój mały świat słów…</div>
        </div>
      `;
    } else {
      el.innerHTML = `
        ${shimmer}
        ${usun}
        <div class="glass-iko">📜</div>
        <div class="tyt">${esc(t.tytul) || 'Tomik bez tytułu'}</div>
        <div class="pod">Wejdź w swój mały świat słów…</div>
        <span class="licznik" title="Liczba wierszy">${licznikTekst}</span>
      `;
    }
    polka.appendChild(el);
  });

  // kafelek nowy tomik
  const nowy = document.createElement('div');
  nowy.className = 'tomik tomik-nowy';
  nowy.onclick = (e)=>{
    e.stopPropagation();
    // klik w puste tło (nie w input/przycisk/bąbelek) → reset podglądu
    if(!e.target.closest('.probka') && !e.target.closest('input') && !e.target.closest('button')){
      nowy.classList.remove('podglad-1','podglad-2','podglad-3','podglad-4','podglad-5');
      document.querySelectorAll('.probka').forEach(p => p.classList.remove('wybrana'));
      const pierwsza = nowy.querySelector('.probka.s1');
      if(pierwsza) pierwsza.classList.add('wybrana');
      wybranyStyl = 1;
    }
  };
  nowy.innerHTML = `
    <div class="plus">➕ Nowy tomik</div>
    <input type="text" id="nowy-tomik-input" placeholder="nazwa tomiku"
           onkeydown="if(event.key==='Enter')dodajTomik()">
    <button class="btn mini solid" onclick="dodajTomik()">Dodaj tomik</button>
    <div class="probki">
      <div class="probka s1 wybrana" data-styl="1" onclick="wybierzStyl(this,1)" title="Szkło"></div>
      <div class="probka s2" data-styl="2" onclick="wybierzStyl(this,2)" title="Ramka"></div>
      <div class="probka s3" data-styl="3" onclick="wybierzStyl(this,3)" title="Książka"></div>
      <div class="probka s4" data-styl="4" onclick="wybierzStyl(this,4)" title="Liście"></div>
      <div class="probka s5" data-styl="5" onclick="wybierzStyl(this,5)" title="Miękki"></div>
    </div>
    <div class="probki-hint">wybierz wygląd kafelka</div>
  `;
  polka.appendChild(nowy);
}

let wybranyStyl = 1;   // domyślnie szkło

function wybierzStyl(el, nr){
  wybranyStyl = nr;
  document.querySelectorAll('.probka').forEach(p => p.classList.remove('wybrana'));
  el.classList.add('wybrana');
  // podgląd na żywo — kafelek Nowy tomik przybiera wybrany styl
  const kafel = el.closest('.tomik-nowy');
  if(kafel){
    kafel.classList.remove('podglad-1','podglad-2','podglad-3','podglad-4','podglad-5');
    kafel.classList.add('podglad-' + nr);
  }
}

function dodajTomik(){
  const inp = document.getElementById('nowy-tomik-input');
  const nazwa = inp.value.trim();
  if(!nazwa){ inp.focus(); return; }
  if(dane.tomiki.some(t => t.tytul === nazwa)){
    toast('Taki tomik już istnieje');
    return;
  }
  dane.tomiki.push({ tytul: nazwa, styl: wybranyStyl, wiersze: [] });
  wybranyStyl = 1;   // reset na domyślny
  zapiszLokalnie();
  rysujPolke();
  toast('Dodano tomik „' + nazwa + '"');
}

function usunTomik(i){
  const t = dane.tomiki[i];
  const ile = (t.wiersze||[]).length;
  const kom = ile > 0
    ? `Usunąć tomik „${t.tytul}" wraz z ${ile} ${odmianaWierszy(ile)}?`
    : `Usunąć pusty tomik „${t.tytul}"?`;
  if(!confirm(kom)) return;
  dane.tomiki.splice(i, 1);
  zapiszLokalnie();
  rysujPolke();
  toast('Usunięto tomik');
}

/* ============ WNĘTRZE TOMIKU ============ */
function otworzTomik(i){
  aktTomik = i;
  aktWiersz = null;
  document.getElementById('ekran-polka').style.display = 'none';
  document.getElementById('wnetrze').classList.add('on');
  document.getElementById('wnetrze-tytul').textContent = dane.tomiki[i].tytul;
  rysujSpis();
  rysujEdytorPusty();
  window.scrollTo(0,0);
}

function wrocDoPolki(){
  aktTomik = null;
  aktWiersz = null;
  document.getElementById('wnetrze').classList.remove('on');
  document.getElementById('ekran-polka').style.display = 'block';
  rysujPolke();
  window.scrollTo(0,0);
}

function rysujSpis(){
  const lista = document.getElementById('spis-lista');
  const wiersze = dane.tomiki[aktTomik].wiersze || [];
  lista.innerHTML = '';
  if(wiersze.length === 0){
    lista.innerHTML = '<div class="spis-pusty">Pusto. Dodaj pierwszy wiersz →</div>';
    return;
  }
  wiersze.forEach((w, i)=>{
    const el = document.createElement('div');
    el.className = 'spis-poz' + (i === aktWiersz ? ' akt' : '');
    el.onclick = ()=> otworzWiersz(i);
    el.innerHTML = `<span class="nr">${i+1}</span><span class="tt">${esc(w.tytul) || 'bez tytułu'}</span>`;
    lista.appendChild(el);
  });
}

function otworzWiersz(i){
  // zapisz bieżący przed przełączeniem
  zapiszBiezacyWiersz(true);
  aktWiersz = i;
  rysujSpis();
  rysujEdytor();
}

function rysujEdytorPusty(){
  document.getElementById('edytor').innerHTML = `
    <div class="edytor-pusty">
      <div class="ikona">✒️</div>
      <p>Wybierz wiersz z listy<br>albo dodaj nowy</p>
    </div>`;
}

function rysujEdytor(){
  const w = dane.tomiki[aktTomik].wiersze[aktWiersz];
  const ed = document.getElementById('edytor');
  ed.innerHTML = `
    <label>Tytuł wiersza</label>
    <input type="text" id="w-tytul" value="${esc(w.tytul)}" placeholder="tytuł…"
           oninput="podgladTytul()">
    <label>Treść</label>
    <textarea id="w-tresc" placeholder="Tu zapisz swój wiersz…">${esc(w.tresc)}</textarea>
    <div class="edytor-akcje">
      <button class="btn solid mini" onclick="zapiszBiezacyWiersz(false)">💾 Zapisz wiersz</button>
      <button class="btn danger mini" onclick="usunWiersz()">🗑 Usuń wiersz</button>
    </div>
  `;
}

function podgladTytul(){
  // odśwież tytuł w spisie na żywo
  const val = document.getElementById('w-tytul').value;
  dane.tomiki[aktTomik].wiersze[aktWiersz].tytul = val;
  rysujSpis();
}

function nowyWiersz(){
  zapiszBiezacyWiersz(true);
  dane.tomiki[aktTomik].wiersze.push({ tytul:'', tresc:'' });
  aktWiersz = dane.tomiki[aktTomik].wiersze.length - 1;
  zapiszLokalnie();
  rysujSpis();
  rysujEdytor();
  setTimeout(()=>{ const t = document.getElementById('w-tytul'); if(t) t.focus(); }, 50);
}

function zapiszBiezacyWiersz(cicho){
  if(aktWiersz === null) return;
  const tyt = document.getElementById('w-tytul');
  const tre = document.getElementById('w-tresc');
  if(!tyt || !tre) return;
  dane.tomiki[aktTomik].wiersze[aktWiersz] = {
    tytul: tyt.value.trim(),
    tresc: tre.value
  };
  zapiszLokalnie();
  rysujSpis();
  if(!cicho) toast('Zapisano wiersz');
}

function usunWiersz(){
  if(aktWiersz === null) return;
  const w = dane.tomiki[aktTomik].wiersze[aktWiersz];
  if(!confirm(`Usunąć wiersz „${w.tytul || 'bez tytułu'}"?`)) return;
  dane.tomiki[aktTomik].wiersze.splice(aktWiersz, 1);
  aktWiersz = null;
  zapiszLokalnie();
  rysujSpis();
  rysujEdytorPusty();
  toast('Usunięto wiersz');
}

/* ============ EKSPORT / IMPORT ============ */
/* pobiera JEDEN otwarty tomik jako osobny plik .json (do wczytania w formularzu) */
function pobierzTomik(){
  if(aktTomik === null) return;
  zapiszBiezacyWiersz(true);
  const t = dane.tomiki[aktTomik];
  const tomik = {
    tytul: t.tytul,
    styl: t.styl || 1,
    wiersze: (t.wiersze||[]).map(w => ({ tytul: w.tytul, tresc: w.tresc }))
  };
  // nazwa pliku z tytułu tomiku (bezpieczna) albo "tomik"
  const bezpieczna = (t.tytul || 'tomik')
    .toLowerCase()
    .replace(/[ąàáâ]/g,'a').replace(/[ćč]/g,'c').replace(/[ęèé]/g,'e')
    .replace(/ł/g,'l').replace(/[ńñ]/g,'n').replace(/[óòô]/g,'o')
    .replace(/[śš]/g,'s').replace(/[żź]/g,'z').replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'tomik';
  const blob = new Blob([JSON.stringify(tomik, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tomik-' + bezpieczna + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('Pobrano tomik „' + t.tytul + '"');
}

function eksportuj(){
  zapiszBiezacyWiersz(true);
  // format zgodny z dane.json — tomiki trafiają pod pierwszego (pustego) artystę,
  // resztę pól poeta uzupełni w formularzu zgłoszeniowym
  const wynik = {
    slug: '',
    nazwa: '',
    lat: null,
    lng: null,
    artysci: [
      {
        imie_nazwisko: '',
        tomiki: dane.tomiki.map(t => ({
          tytul: t.tytul,
          styl: t.styl || 1,
          wiersze: (t.wiersze||[]).map(w => ({
            tytul: w.tytul,
            tresc: w.tresc
          }))
        }))
      }
    ]
  };
  const blob = new Blob([JSON.stringify(wynik, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dane.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('Zapisano dane.json na dysk');
}

function wczytajPlik(){
  document.getElementById('plik-input').click();
}

document.getElementById('plik-input').addEventListener('change', function(e){
  const plik = e.target.files[0];
  if(!plik) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const wczyt = JSON.parse(r.result);
      const tomiki = wyciagnijTomiki(wczyt);
      if(tomiki === null){
        toast('Nie znalazłem tomików w tym pliku');
        return;
      }
      if(dane.tomiki.length > 0){
        if(!confirm('Wczytać tomiki z pliku? Zastąpią obecne.')) { e.target.value=''; return; }
      }
      dane = { tomiki };
      aktTomik = null; aktWiersz = null;
      zapiszLokalnie();
      wrocDoPolki();
      toast('Wczytano ' + tomiki.length + ' ' + odmianaTomikow(tomiki.length));
    }catch(err){
      toast('To nie jest poprawny plik JSON');
    }
    e.target.value = '';
  };
  r.readAsText(plik);
});

/* wyciąga tomiki z różnych możliwych struktur */
function wyciagnijTomiki(obj){
  if(!obj || typeof obj !== 'object') return null;
  // 1) prosty format notatnika: { tomiki: [...] }
  if(Array.isArray(obj.tomiki)) return normalizujTomiki(obj.tomiki);
  // 2) pełny dane.json: { artysci: [ { tomiki: [...] } ] }
  if(Array.isArray(obj.artysci) && obj.artysci.length){
    // zbierz tomiki ze wszystkich artystów
    let wszystkie = [];
    obj.artysci.forEach(a => { if(Array.isArray(a.tomiki)) wszystkie = wszystkie.concat(a.tomiki); });
    if(wszystkie.length) return normalizujTomiki(wszystkie);
    return [];
  }
  // 3) sam artysta: { tomiki: [...] } już złapane wyżej
  return null;
}

function normalizujTomiki(arr){
  return arr.map(t => ({
    tytul: t.tytul || t.tytul_tomiku || '',
    styl: t.styl || 1,
    wiersze: (t.wiersze || []).map(w => ({
      tytul: w.tytul || '',
      tresc: w.tresc || w.tekst || ''
    }))
  }));
}

/* ============ POMOCNICZE ============ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function odmianaWierszy(n){
  if(n === 1) return 'wierszem';
  return 'wierszami';
}
function odmianaTomikow(n){
  if(n === 1) return 'tomik';
  if(n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return 'tomiki';
  return 'tomików';
}
function toast(txt){
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ============ START ============ */
wczytajLokalnie();
// jeśli pusto — dodaj jeden przykładowy tomik
if(dane.tomiki.length === 0){
  dane.tomiki.push({
    tytul: 'Pierwszy tomik',
    wiersze: [
      { tytul: 'Powitanie', tresc: 'To Twój pierwszy wiersz.\nMożesz go zmienić albo usunąć.\n\nPisz swobodnie —\nwszystko zapisuje się samo.' }
    ]
  });
  zapiszLokalnie();
}
rysujPolke();
</script>
</body>
</html>
